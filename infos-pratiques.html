<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infos pratiques - L'Alpe des Chaux</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{
  font-family:Arial,Helvetica,sans-serif;color:white;overflow:hidden;
  background:
    linear-gradient(90deg,rgba(10,18,24,.58) 0%,rgba(10,18,24,.30) 45%,rgba(10,18,24,.10) 100%),
    url("IMG_20260328_061418.jpg");
  background-size:cover;background-position:center center;background-repeat:no-repeat;
}
.page{height:100vh;width:100%;display:flex;flex-direction:column;padding:4vh 5vw 4vh}
.languages{position:absolute;top:4vh;right:5vw;display:flex;align-items:center;gap:8px;font-size:1.05vw;letter-spacing:.12em;text-shadow:0 2px 8px rgba(0,0,0,.65)}
.languages button{border:0;background:transparent;color:rgba(255,255,255,.68);font:inherit;padding:6px 7px;cursor:pointer}
.languages button.active{color:#fff;border-bottom:2px solid #fff}
.languages button:focus{outline:2px solid rgba(255,255,255,.95);outline-offset:2px;border-radius:8px;background:rgba(255,255,255,.10)}
.languages .bar{opacity:.55}
.brand{margin-bottom:5vh}
.brand-main{font-size:1.5vw;font-weight:600;letter-spacing:.45em;display:flex;align-items:center}
.brand-mountains{width:31px;height:20px;margin-right:15px;flex:0 0 auto;stroke:#fff;stroke-width:1.05;fill:none;stroke-linecap:round;stroke-linejoin:round}
.brand-sub{margin-top:10px;font-size:.75vw;letter-spacing:.45em}
.hero h1{margin:0;font-family:Georgia,serif;font-size:4vw;line-height:1;text-shadow:0 3px 15px rgba(0,0,0,.45)}
.hero p{margin-top:18px;font-size:1.2vw;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.menu{margin-top:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:1vw}
.card{
 height:19vh;min-height:125px;background:rgba(13,23,28,.64);
 border:1px solid rgba(255,255,255,.55);border-radius:18px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;color:white;text-decoration:none;backdrop-filter:blur(5px);
 -webkit-backdrop-filter:blur(5px);transition:.25s
}
.card:hover,.card:focus,.back:focus{background:rgba(255,255,255,.28);transform:translateY(-4px);outline:3px solid #fff;outline-offset:3px}
.icon{width:42px;height:42px;margin-bottom:16px;stroke:white;stroke-width:1.6;fill:none}
.card span{font-size:1vw}
.bottom{margin-top:2vh;display:flex;align-items:center;justify-content:space-between}
.back{color:white;text-decoration:none;font-size:1vw;padding:10px 16px;border-radius:10px;background:rgba(13,23,28,.55);border:1px solid rgba(255,255,255,.45)}
.footer{font-size:1.1vw;letter-spacing:.4em;font-weight:300}
.sep{opacity:.6;margin:0 14px}
@media(max-width:900px){
 body{overflow:auto}.page{min-height:100vh;height:auto}.languages{top:3vh;right:4vw;font-size:12px;gap:3px}
 .brand-main{font-size:18px}.brand-sub{font-size:10px}.hero h1{font-size:40px}.hero p{font-size:15px}
 .menu{grid-template-columns:repeat(2,1fr)}.card span{font-size:13px}.back{font-size:13px}.footer{font-size:11px}
}
</style>
</head>
<body>
<div class="page">
 <div class="languages" aria-label="Langue">
  <button type="button" class="active" data-lang="fr">FR</button><span class="bar">|</span>
  <button type="button" data-lang="en">EN</button><span class="bar">|</span>
  <button type="button" data-lang="de">DE</button>
 </div>
 <div class="brand">
  <div class="brand-main"><svg class="brand-mountains" viewBox="0 0 36 22" aria-hidden="true"><path d="M1.5 19L10 8.5L15.5 15.2"/><path d="M8.5 19L19 3L28 16"/><path d="M20.5 19L27 10.5L34.5 19"/></svg><span>L'ALPE DES CHAUX</span></div>
  <div class="brand-sub">GRYON</div>
 </div>
 <div class="hero">
  <h1 id="title">Infos pratiques</h1>
  <p id="subtitle">Toutes les informations utiles pour votre séjour.</p>
 </div>
 <div class="menu">
  <a class="card" href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22c4 0 7-3 7-7 0-5-4-8-6-12 0 4-4 5-4 9-1-1-2-2-2-4-2 2-3 5-3 7 0 4 4 7 8 7z"/><path d="M12 21c-2 0-3-1-3-3 0-2 2-3 3-5 0 2 3 3 3 5 0 2-1 3-3 3z"/></svg><span data-i18n="fireplace">Cheminée</span></a>
  <a class="card" href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M3 14l2-6h14l2 6v5h-2v2h-2v-2H7v2H5v-2H3z"/><circle cx="7" cy="15" r="1"/><circle cx="17" cy="15" r="1"/></svg><span data-i18n="parking">Parking</span></a>
  <a class="card" href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M8 6h8"/><path d="M9 6l1-2h4l1 2"/><path d="M6 7l1 14h10l1-14"/><path d="M10 10v8M14 10v8"/></svg><span data-i18n="waste">Déchets</span></a>
  <a class="card" href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M10 14.5V5a3 3 0 016 0v9.5a5 5 0 11-6 0z"/><path d="M13 7v9"/><path d="M5 7c1-1 1-2 0-3"/><path d="M5 12c1-1 1-2 0-3"/><path d="M5 17c1-1 1-2 0-3"/></svg><span data-i18n="heating">Chauffage</span></a>
  <a class="card" href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M5 4h4l2 5-3 2c1.5 3 3 4.5 6 6l2-3 5 2v4c0 1-1 2-2 2C10 22 2 14 2 6c0-1 1-2 3-2z"/></svg><span data-i18n="contact">Contact</span></a>
 </div>
 <div class="bottom">
  <a class="back" href="index.html" data-i18n="back">← Retour à l'accueil</a>
  <div class="footer">NATURE <span class="sep">|</span>DÉTENTE <span class="sep">|</span>GRAND AIR</div>
 </div>
</div>
<script>
const translations={
 fr:{title:"Infos pratiques",subtitle:"Toutes les informations utiles pour votre séjour.",fireplace:"Cheminée",parking:"Parking",waste:"Déchets",heating:"Chauffage",contact:"Contact",back:"← Retour à l'accueil"},
 en:{title:"Practical info",subtitle:"All the useful information for your stay.",fireplace:"Fireplace",parking:"Parking",waste:"Waste",heating:"Heating",contact:"Contact",back:"← Back to home"},
 de:{title:"Praktische Infos",subtitle:"Alle nützlichen Informationen für Ihren Aufenthalt.",fireplace:"Kamin",parking:"Parkplatz",waste:"Abfall",heating:"Heizung",contact:"Kontakt",back:"← Zurück zur Startseite"}
};
function setLanguage(lang){
 const t=translations[lang]; document.documentElement.lang=lang;
 document.getElementById("title").textContent=t.title; document.getElementById("subtitle").textContent=t.subtitle;
 document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t[el.dataset.i18n]);
 document.querySelectorAll(".languages button").forEach(btn=>btn.classList.toggle("active",btn.dataset.lang===lang));
 localStorage.setItem("gryontv-language",lang);
}
document.querySelectorAll(".languages button").forEach(btn=>btn.addEventListener("click",()=>setLanguage(btn.dataset.lang)));
setLanguage(localStorage.getItem("gryontv-language")||"fr");

const cards=Array.from(document.querySelectorAll(".menu .card"));
const langs=Array.from(document.querySelectorAll("[data-lang]"));
const back=document.querySelector(".back");
let ci=0, li=Math.max(0,langs.findIndex(x=>x.classList.contains("active")));
function fc(i){ci=(i+cards.length)%cards.length;cards[ci].focus()}
function fl(i){li=(i+langs.length)%langs.length;langs[li].focus()}
cards.forEach((x,i)=>x.addEventListener("focus",()=>ci=i));
langs.forEach((x,i)=>x.addEventListener("focus",()=>li=i));
document.addEventListener("keydown",e=>{
 const a=document.activeElement,k=e.key,c=e.keyCode||e.which,onC=cards.includes(a),onL=langs.includes(a),onB=a===back;
 if(k==="ArrowRight"||c===22){e.preventDefault();if(onL)fl(li+1);else if(onC)fc(ci+1);else if(onB)fc(0);else fc(0)}
 else if(k==="ArrowLeft"||c===21){e.preventDefault();if(onL)fl(li-1);else if(onC)fc(ci-1);else if(onB)fc(cards.length-1);else fc(cards.length-1)}
 else if(k==="ArrowUp"||c===19){if(onC){e.preventDefault();fl(Math.max(0,langs.findIndex(x=>x.classList.contains("active"))))}else if(onB){e.preventDefault();fc(ci)}}
 else if(k==="ArrowDown"||c===20){if(onL){e.preventDefault();fc(ci)}else if(onC){e.preventDefault();back.focus()}}
 else if(k==="Enter"||k===" "||c===23||c===66){if(onC||onL||onB){e.preventDefault();a.click()}}
});
setTimeout(()=>fc(0),300);
</script>
</body>
</html>
