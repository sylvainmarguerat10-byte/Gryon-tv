function setLang(l){const x=tr[l];document.getElementById('title').textContent=x.title;document.getElementById('free').textContent=x.free;document.getElementById('back').textContent=x.back;for(let i=1;i<=7;i++){const n=document.getElementById('n'+i);if(n)n.textContent=x.n[i-1];document.getElementById('d'+i).textContent=x.d[i-1];document.getElementById('x'+i).textContent=x.x[i-1]}['fr','en','de'].forEach(k=>document.getElementById(k).classList.toggle('active',k===l));localStorage.setItem('gryontv-language',l)}

let pg=0;function show(n){pg=Math.max(0,Math.min(2,n));document.getElementById('track').style.transform=`translateX(-${pg*33.333333}%)`;document.getElementById('leftHint').style.display=pg>0?'block':'none';document.getElementById('rightHint').style.display=pg<2?'block':'none'}show(0);
document.addEventListener('keydown',e=>{const a=document.activeElement,langs=['fr','en','de'].map(id=>document.getElementById(id)),back=document.getElementById('back'),onLang=langs.includes(a),onBack=a===back;const middle=()=>{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()};if(e.key==='ArrowUp'){if(!onLang)langs[0].focus();e.preventDefault()}else if(e.key==='ArrowDown'){if(onLang||onBack)middle();else back.focus();e.preventDefault()}else if(e.key==='ArrowRight'){if(onLang)langs[Math.min(2,langs.indexOf(a)+1)].focus();else if(onBack)middle();else if(pg<2){show(pg+1);middle()}e.preventDefault()}else if(e.key==='ArrowLeft'){if(onLang)langs[Math.max(0,langs.indexOf(a)-1)].focus();else if(onBack)middle();else if(pg>0){show(pg-1);middle()}e.preventDefault()}else if((e.key==='Enter'||e.key==='NumpadEnter')&&onBack){window.location.href='./index.html';e.preventDefault()}});
